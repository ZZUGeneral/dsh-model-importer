name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Check locale parity
        run: |
          node -e '
            const zh = require("./locale/zh.json");
            const en = require("./locale/en.json");
            const a = Object.keys(zh).sort().join(",");
            const b = Object.keys(en).sort().join(",");
            if (a !== b) { console.error("locale keys differ:\nzh=" + a + "\nen=" + b); process.exit(1); }
          '

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          expected="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Skip when this version is already published
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-model-importer@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-model-importer@$version is already on npm, skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
